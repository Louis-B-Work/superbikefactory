name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm test
          npm run lint
      - name: Build static site and responsive images
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Preview of the stock/classified version, published under /classified-site.
      # Checked out after the main build so it can't affect main's lint or type-check.
      - name: Check out classified-site preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: classified-site
          path: classified
      # A broken preview must not block the main site from deploying.
      - name: Validate classified-site preview
        id: classified-validate
        continue-on-error: true
        working-directory: classified
        run: |
          npm ci
          npm test
      - name: Build classified-site preview
        if: steps.classified-validate.outcome == 'success'
        continue-on-error: true
        working-directory: classified
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}/classified-site
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/classified-site
      - name: Add preview to site output
        run: |
          if [ -f classified/out/index.html ]; then mv classified/out out/classified-site; else echo "classified-site preview was not built; skipping"; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
